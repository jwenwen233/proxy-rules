name: Validate proxy rules

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'schedule'
    name: Validate push and pull requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '20'}
      - name: Download pinned Mihomo
        run: |
          mkdir -p .cache
          curl -fL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.28/mihomo-linux-amd64-compatible-v1.19.28.gz -o .cache/mihomo.gz
          echo '70d01cfb8cb7bf7a92fd1af16cb4b9553d90bb4eecde3b5c4849103e27c80ddb  .cache/mihomo.gz' | sha256sum -c -
          gzip -dc .cache/mihomo.gz > .cache/mihomo
          chmod +x .cache/mihomo
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: node --test tests/test_clash_script.cjs
      - name: Validate fixture with Mihomo
        run: |
          node -e "const {main}=require('./configs/clash-verge-script.js'); const c=require('./tests/fixtures/airport.json'); process.stdout.write(JSON.stringify(main(c)))" > .cache/test-config.yaml
          .cache/mihomo -t -f .cache/test-config.yaml
      - run: python scripts/build_rules.py --check
      - run: python scripts/validate.py

  scheduled-update:
    if: github.event_name == 'schedule'
    name: Update upstream rules through a review PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '20'}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/sync_upstreams.py --update
      - run: pytest -q
      - run: node --test tests/test_clash_script.cjs
      - run: python scripts/build_rules.py
      - run: python scripts/build_rules.py --check
      - run: python scripts/validate.py
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: main
          branch: automation/update-rules
          title: 'chore: update upstream rules'
